<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DineSpace — Smart Campus Dining</title>
  <script>
    // Smart redirect to frontend app
    (function() {
      const token = localStorage.getItem('dinespace_jwt_token');
      const targetPage = token ? 'home.html' : 'login.html';
      
      // Determine if running under subfolder (like GitHub Pages /DineSpace/)
      const pathname = window.location.pathname;
      const baseDir = pathname.endsWith('/') ? pathname : pathname + '/';
      
      // Navigate to frontend
      window.location.replace(baseDir + 'frontend/' + targetPage + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body style="background-color: #070B11; color: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center; padding: 20px;">
    <div style="display: inline-flex; align-items: baseline; font-size: 28px; font-weight: bold; margin-bottom: 12px;">
      <span>Dine</span><span style="color: #FF5E1E;">Space</span>
    </div>
    <p style="color: #8B9BB4; font-size: 14px; margin-bottom: 20px;">Opening campus dining dashboard...</p>
    <a href="frontend/login.html" style="display: inline-block; background: #FF5E1E; color: white; padding: 10px 20px; border-radius: 12px; text-decoration: none; font-size: 13px; font-weight: 600;">Click here if not redirected automatically →</a>
  </div>
</body>
</html>
